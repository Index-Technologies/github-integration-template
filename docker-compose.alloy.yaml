services:
  postgres:
    image: postgres:16
    network_mode: host
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: myapp
      POSTGRES_DB: myapp
    volumes:
      - postgres_data_alloy:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U myapp -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22-bookworm
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
      - node_modules_alloy:/app/node_modules
    environment:
      DATABASE_URL: postgres://myapp:myapp@127.0.0.1:5432/myapp
      NEXT_TELEMETRY_DISABLED: "1"
      IS_ALLOY: ${IS_ALLOY:-true}
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -lc "npm install && npm run dev -- --hostname 0.0.0.0"

volumes:
  node_modules_alloy:
  postgres_data_alloy:
